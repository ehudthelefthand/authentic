<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentic – Identity Wall</title>
  <link rel="stylesheet" href="/styles/design-system.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="/fingerprint.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--color-bg); font-family: var(--font-family); }
    canvas { display: block; }
    #ws-status {
      position: fixed; bottom: 12px; right: 16px;
      font-family: monospace; font-size: 10px; color: #1e293b; letter-spacing: 1px;
    }
    .layer-btn {
      position: fixed; bottom: 12px;
      font-family: monospace; font-size: 10px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #334155; border-radius: 4px; cursor: pointer; letter-spacing: 1px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .layer-btn { display: none; }
    .layer-on  { color: #7dd3fc !important; border-color: rgba(125,211,252,0.35) !important; background: rgba(125,211,252,0.08) !important; }
    .layer-off { color: #7f1d1d !important; border-color: rgba(239,68,68,0.2)  !important; background: rgba(239,68,68,0.04) !important; text-decoration: line-through; }

    /* Display header (DOM, overlaying canvas) */
    #display-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      text-align: center; padding: 22px 16px 0;
      pointer-events: none;
      font-family: var(--font-family);
    }
    #display-header h1 {
      margin: 0;
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: 8px;
      color: var(--color-text-primary);
      opacity: 0.82;
    }
    #display-header .tagline {
      margin: 8px 0 0;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-regular);
      letter-spacing: 1px;
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    /* Waiting hint at the bottom of the display */
    #display-hint {
      position: fixed; left: 0; right: 0; bottom: 30px;
      z-index: 200; text-align: center; pointer-events: none;
      font-family: var(--font-family);
      font-size: var(--font-size-sm);
      letter-spacing: 1px;
      color: var(--color-text-dim);
      animation: hint-breathe 3.6s ease-in-out infinite;
      display: none;
    }
    #display-hint.show { display: block; }
    @keyframes hint-breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.75; } }

    /* Replay badge */
    #replay-badge {
      position: fixed; top: 24px; left: 24px;
      z-index: 200; pointer-events: none;
      font-family: var(--font-family);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      letter-spacing: 2px;
      color: var(--color-danger);
      display: none;
    }
    #replay-badge.show { display: block; }

    /* Tap-to-start overlay (audio unlock) */
    #tap-to-start {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(10, 10, 20, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: var(--font-family);
      color: var(--color-text-primary);
      cursor: pointer; user-select: none;
      animation: tap-pulse 2s ease-in-out infinite;
    }
    #tap-to-start.hidden { display: none; }
    #tap-to-start .label { font-size: 11px; letter-spacing: 4px; color: var(--color-text-dim); text-transform: uppercase; margin-bottom: 12px; }
    #tap-to-start .title { font-size: 48px; font-weight: 700; letter-spacing: 6px; color: var(--color-accent); text-shadow: var(--glow-accent); }
    #tap-to-start .hint  { font-size: 13px; color: var(--color-text-muted); margin-top: 20px; letter-spacing: 2px; }
    @keyframes tap-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }

    /* Verdict overlay */
    #verdict-overlay {
      position: fixed; left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      font-family: var(--font-family);
      z-index: 500;
      padding: 32px 0;
    }
    #verdict-overlay.show { display: flex; animation: verdict-glitch 0.22s steps(4, end) both; }
    #verdict-overlay .band {
      width: 100%;
      padding: 36px 0;
      text-align: center;
      backdrop-filter: blur(2px);
    }
    #verdict-overlay.unauthentic .band {
      background: linear-gradient(90deg, rgba(244,63,94,0) 0%, rgba(244,63,94,0.55) 15%, rgba(244,63,94,0.7) 50%, rgba(244,63,94,0.55) 85%, rgba(244,63,94,0) 100%);
      border-top: 2px solid rgba(244,63,94,0.85);
      border-bottom: 2px solid rgba(244,63,94,0.85);
      box-shadow: 0 0 60px rgba(244,63,94,0.5), inset 0 0 80px rgba(244,63,94,0.25);
    }
    #verdict-overlay.authentic .band {
      background: linear-gradient(90deg, rgba(16,185,129,0) 0%, rgba(16,185,129,0.45) 15%, rgba(16,185,129,0.6) 50%, rgba(16,185,129,0.45) 85%, rgba(16,185,129,0) 100%);
      border-top: 2px solid rgba(16,185,129,0.85);
      border-bottom: 2px solid rgba(16,185,129,0.85);
      box-shadow: 0 0 60px rgba(16,185,129,0.5), inset 0 0 80px rgba(16,185,129,0.25);
    }
    #verdict-overlay .title {
      font-size: 96px; font-weight: 700; letter-spacing: 14px;
      line-height: 1;
    }
    #verdict-overlay.unauthentic .title { color: #fee2e2; text-shadow: 0 0 30px rgba(244,63,94,0.9), 0 0 60px rgba(244,63,94,0.6); }
    #verdict-overlay.authentic .title { color: #d1fae5; text-shadow: 0 0 30px rgba(16,185,129,0.9), 0 0 60px rgba(16,185,129,0.6); }
    #verdict-overlay .sub {
      font-size: 16px; letter-spacing: 8px; margin-top: 18px; text-transform: uppercase;
    }
    #verdict-overlay.unauthentic .sub { color: #fecaca; }
    #verdict-overlay.authentic .sub { color: #a7f3d0; }
    @keyframes verdict-glitch {
      0%   { opacity: 0; transform: translateY(-50%) translateX(-6px); filter: hue-rotate(20deg); }
      25%  { opacity: 1; transform: translateY(-50%) translateX(4px); filter: hue-rotate(-15deg); }
      50%  { opacity: 0.4; transform: translateY(-50%) translateX(-2px); filter: hue-rotate(10deg); }
      75%  { opacity: 1; transform: translateY(-50%) translateX(1px); filter: none; }
      100% { opacity: 1; transform: translateY(-50%); filter: none; }
    }
  </style>
</head>
<body>
  <div id="tap-to-start">
    <div class="label">Authentic · System Standby</div>
    <div class="title">TAP TO START</div>
    <div class="hint">audio &amp; display will activate</div>
  </div>

  <div id="verdict-overlay">
    <div class="band">
      <div class="title" id="verdict-title">ERROR</div>
      <div class="sub" id="verdict-sub">IDENTITY NOT VERIFIED</div>
    </div>
  </div>

  <header id="display-header">
    <h1>AUTHENTIC</h1>
    <p class="tagline">สะท้อนพระคริสต์ด้วยชีวิตจริง</p>
  </header>

  <div id="display-hint"></div>
  <div id="replay-badge"></div>

  <div id="ws-status">●</div>

  <button class="layer-btn layer-on" id="l1-btn" onclick="toggleLayer(1)" title="Toggle outer halo">L1</button>
  <button class="layer-btn layer-on" id="l2-btn" onclick="toggleLayer(2)" title="Toggle mid glow">L2</button>
  <button class="layer-btn layer-on" id="l3-btn" onclick="toggleLayer(3)" title="Toggle inner glow">L3</button>
  <button class="layer-btn layer-on" id="l4-btn" onclick="toggleLayer(4)" title="Toggle core">L4</button>

  <script src="/sounds.js"></script>
  <script src="/display-v4.js"></script>
  <script>
    function toggleLayer(n) {
      glowLayers[n] = !glowLayers[n];
      const btn = document.getElementById('l' + n + '-btn');
      btn.className = 'layer-btn ' + (glowLayers[n] ? 'layer-on' : 'layer-off');
    }
  </script>
</body>
</html>
